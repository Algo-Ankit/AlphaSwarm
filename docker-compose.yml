services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphaswarm
      POSTGRES_USER: alphaswarm
      POSTGRES_PASSWORD: alphaswarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaswarm -d alphaswarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      DATABASE_SYNC_URL: postgresql://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      DATABASE_SYNC_URL: postgresql://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - -Q
      - trading_tasks,beat_tasks
      - --loglevel=info
      - --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      DATABASE_SYNC_URL: postgresql://alphaswarm:alphaswarm@postgres:5432/alphaswarm
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      - celery
      - -A
      - app.core.celery_app
      - beat
      - --loglevel=info
      - --schedule=/var/lib/celerybeat/celerybeat-schedule
    volumes:
      - celerybeat_data:/var/lib/celerybeat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Stop at the builder stage: it has the source tree and dev dependencies,
      # which `next dev` needs. The final stage is a production `next start`.
      target: builder
    restart: unless-stopped
    command: ["npx", "next", "dev", "--port", "3000", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost
      NEXT_PUBLIC_DEMO_TENANT_ID: demo-tenant-001
      NEXT_PUBLIC_DEMO_USER_ID: demo-user-001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  celerybeat_data:

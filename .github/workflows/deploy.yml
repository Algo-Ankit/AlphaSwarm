name: CD

# Builds the backend + frontend container images and publishes them to the
# GitHub Container Registry (ghcr.io) on every push to main and on version tags.
# Authenticates with the built-in GITHUB_TOKEN — no extra secrets required.
#
# Pull the published images on your server with:
#   docker pull ghcr.io/algo-ankit/alphaswarm-api:latest
#   docker pull ghcr.io/algo-ankit/alphaswarm-web:latest
# Tag a release (v1.2.3) to also get immutable semver-tagged images.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:      # allow manual "Run workflow" from the Actions tab

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alphaswarm-api
            context: .
            dockerfile: ./Dockerfile
            build_args: ""
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so
          # they have to be passed here — setting them on the running container
          # does nothing. Define them under Settings → Secrets and variables →
          # Actions → Variables. Until NEXT_PUBLIC_API_URL is set, the web image
          # builds with an empty API URL and its browser calls go nowhere.
          - image: alphaswarm-web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_DEMO_TENANT_ID=${{ vars.NEXT_PUBLIC_DEMO_TENANT_ID }}
              NEXT_PUBLIC_DEMO_USER_ID=${{ vars.NEXT_PUBLIC_DEMO_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR image names must be lowercase.
          images: ghcr.io/algo-ankit/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── OPTIONAL: deploy to a server after images are published ─────────────────
  # Fill in the repo secrets (Settings → Secrets and variables → Actions) and
  # remove the `if: false` guard to enable. Assumes docker-compose.prod.yml on
  # the host references the ghcr.io images above.
